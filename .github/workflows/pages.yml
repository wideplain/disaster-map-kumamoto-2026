name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# _site を gh-pages ブランチへ push して配信する。actions/deploy-pages の
# デプロイAPIはキュー待ちが10分の上限(仕様上延長不可)を超えて失敗するため使わない。
permissions:
  contents: write
  pages: write

concurrency:
  group: pages-branch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 生成に必要なのは scripts/ と web/ だけ。data/raw の抽出テキストは重いので取らない
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            web
          sparse-checkout-cone-mode: false

      - run: node scripts/build_pages.js

      - name: Publish to gh-pages
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch _site/.nojekyll
          # ブランチ配信では gh-pages 上の CNAME がカスタムドメイン設定の正になる。
          # 置き忘れると Pages のビルドが失敗する
          echo "kumamoto-disaster-map-2026.wideplain.com" > _site/CNAME
          cd _site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # 配信物のツリーSHAを既存 gh-pages と比較する。内容が同じなら push しない
          # (同じ内容でも push すると GitHub 側の Pages ビルドが数分走るため)。
          # sparse-checkout 下では worktree でのファイル比較が使えないのでツリーSHAで判定する
          local_tree=$(git write-tree)
          remote_tree=$(gh api "repos/${GITHUB_REPOSITORY}/commits/gh-pages" --jq '.commit.tree.sha' 2>/dev/null || echo "")
          if [ -n "$remote_tree" ] && [ "$local_tree" = "$remote_tree" ]; then
            echo "配信内容に変更なし。デプロイをスキップする"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      # 配信はGitHub内蔵ワークフロー(pages build and deployment)が行う。
      # このワークフローはGitHub Actions側の障害("Service Unavailable"や
      # deployment_queuedのままのTimeout)で失敗することがあり、失敗しても
      # こちらのrunは成功で終わるため気づけない。結果を確認し、駄目なら作り直す。
      - name: Verify Pages deployment
        if: steps.publish.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 内蔵ワークフローの最新runが完了するまで待ち、conclusionを返す
          wait_internal_run() {
            for _ in $(seq 1 60); do
              json=$(gh run list --repo "$GITHUB_REPOSITORY" --branch gh-pages --limit 1 \
                       --json status,conclusion,databaseId 2>/dev/null || echo "[]")
              st=$(echo "$json" | jq -r '.[0].status // "none"')
              if [ "$st" = "completed" ]; then
                echo "$json" | jq -r '.[0].conclusion'
                return
              fi
              sleep 10
            done
            echo "timeout"
          }

          sleep 20
          for attempt in 1 2 3; do
            result=$(wait_internal_run)
            echo "配信ワークフローの結果(${attempt}回目): ${result}"
            if [ "$result" = "success" ]; then
              echo "デプロイ完了"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "GitHub側の失敗とみて再ビルドを要求する"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || true
              sleep 30
            fi
          done
          echo "::error::Pagesの配信が3回とも完了しなかった。GitHub Actionsの障害状況を確認すること"
          exit 1
