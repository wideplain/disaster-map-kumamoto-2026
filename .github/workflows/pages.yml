name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# _site を gh-pages ブランチへ push して配信する。
# actions/deploy-pages のデプロイAPIはキュー待ちが10分の上限を超えて失敗することが
# あるため、その経路を通らないブランチ配信にしている。
permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build_pages.js
      - name: Publish to gh-pages
        run: |
          touch _site/.nojekyll
          echo "kumamoto-disaster-map-2026.wideplain.com" > _site/CNAME
          cd _site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
